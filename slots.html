<script>

/* Porte-monnaie partagé entre tous les jeux */

try{Object.assign(W,JSON.parse(localStorage.getItem('casino-wallet')||'{}'))}catch(e){}
if(!(typeof W.bank==='number'&&W.bank>=0&&W.bank<1e9))W.bank=1000;

  b:[['human','Humain',0],['cat','Chat',1000],['fox','Renard',1500],['panda','Panda',2000],['robot','Robot',3000],['alien','Extraterrestre',5000],['ghost','Fantôme',7500]],

  e:[['normal','Normaux',0],['joyeux','Joyeux',200],['rondes','Lunettes rondes',400],['patch','Cache-œil',800],['shades','Lunettes de soleil',1500],['monocle','Monocle',2500]],
  m:[['sourire','Sourire',0],['grand','Grand sourire',150],['langue','Langue',300],['moustache','Moustache',700],['barbe','Barbe',1200]],
  hat:[['none','Aucun',0],['casquette','Casquette',300],['bonnet','Bonnet',400],['fete','Chapeau de fête',500],['cowboy','Cowboy',600],['bandana','Bandana',800],['audio','Casque audio',900],['haut','Haut-de-forme',2500],['wizard','Chapeau de magicien',4000],['crown','Couronne',10000],['helmet','Casque spatial',50000]],
  n:[['none','Aucun',0],['bowtie','Nœud papillon',300],['echarpe','Écharpe',500],['chain','Chaîne en or',8000]]
};
const AVCAT={b:'Personnage',sk:'Peau',bg:'Fond',h:'Coiffure',hc:'Cheveux',e:'Yeux',m:'Bouche',hat:'Chapeau',n:'Cou'};
const AVKEYS=Object.keys(AVO);
const AVITEMS=[];AVKEYS.forEach(k=>AVO[k].forEach((o,i)=>{if(o[2]>0)AVITEMS.push(k+':'+i)}));
const itemPrice=(k,i)=>AVO[k][i]?AVO[k][i][2]:0;
const owns=(k,i,owned=W.owned)=>itemPrice(k,i)===0||owned.includes(k+':'+i);
const DEFCFG={b:0,sk:0,bg:0,h:1,hc:0,e:0,m:0,hat:0,n:0};
function parseCfg(str){
  const c={...DEFCFG};
  String(str||'').split('.').forEach((v,j)=>{const k=AVKEYS[j],n=parseInt(v,10);if(k&&Number.isInteger(n)&&n>=0&&n<AVO[k].length)c[k]=n});
  return c;
}
const cfgStr=c=>AVKEYS.map(k=>c[k]).join('.');
function cleanCfg(c,owned=W.owned){const o={...c};AVKEYS.forEach(k=>{if(!owns(k,o[k],owned))o[k]=DEFCFG[k]});return o}

/* Ancienne boutique (avatars tout faits) -> nouveaux accessoires */
const OLDMAP={croupier:[['n',1],['hc',1]],cowboy:[['hat',4]],pirate:[['hat',5],['e',3]],chat:[['b',1]],renard:[['b',2]],panda:[['b',3]],robot:[['b',4]],
  magicien:[['hat',8],['m',4]],alien:[['b',5]],fantome:[['b',6]],roi:[['hat',9],['m',4]],flambeur:[['e',4],['n',3]],astronaute:[['hat',10]]};
function fromOld(ids,eq){
  const owned=[],c={...DEFCFG};
  for(const id of ids)for(const [k,i] of OLDMAP[id]||[]){if(itemPrice(k,i)>0&&!owned.includes(k+':'+i))owned.push(k+':'+i)}
  for(const [k,i] of OLDMAP[eq]||[])c[k]=i;
  return {owned,cfg:cfgStr(c)};
}
if(W.owned.some(id=>OLDMAP[id]||id==='joueur')){const m=fromOld(W.owned,W.avatar);W.owned=m.owned;W.cfg=m.cfg}
W.owned=W.owned.filter(x=>AVITEMS.includes(x));
W.cfg=cfgStr(cleanCfg(parseCfg(W.cfg)));

  const B=AVO.b[c.b][0],E='#222',acc=k=>AVO[k][c[k]][0],skin=AVO.sk[c.sk][0],bgv=AVO.bg[c.bg][0],hc=AVO.hc[c.hc][0];
  let s='';

  else s+=`<circle cx="32" cy="32" r="32" fill="${bgv}"/>`;
  s+=`<circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>`;
  const hair=acc('h'),eyes=acc('e'),mouth=acc('m'),hat=acc('hat'),neck=acc('n');
  let eyeY=36;
  if(B==='human'){
    if(hair==='afro')s+=`<circle cx="32" cy="29" r="22" fill="${hc}"/>`;
    if(hair==='long')s+=`<path d="M14 36 Q13 18 32 17 Q51 18 50 36 L52 56 Q44 52 40 48 L24 48 Q20 52 12 56Z" fill="${hc}"/>`;
    s+=`<rect x="25" y="50" width="14" height="10" fill="${skin}"/><path d="M12 64 Q14 52 32 52 Q50 52 52 64Z" fill="rgba(0,0,0,.35)"/><circle cx="32" cy="36" r="16" fill="${skin}"/>`;
    if(hair==='court'||hair==='long'||hair==='chignon'||hair==='meche')s+=`<path d="M16 34 Q16 18 32 18 Q48 18 48 34 Q44 26 32 25 Q22 25 16 34Z" fill="${hc}"/>`;

/* ===== Code de sauvegarde : 16 caractères (jetons + accessoires achetés) ===== */
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h}
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const toB32=(v,n)=>{let t='';for(let i=n-1;i>=0;i--)t+=B32[Number((v>>BigInt(i*5))&31n)];return t};
function normCode(code){return String(code).toUpperCase().replace(/[\s-]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V')}
function fromB32(c){let v=0n;for(const ch of c){const k=B32.indexOf(ch);if(k<0)return null;v=(v<<5n)|BigInt(k)}return v}
const SALT2=0x3c9e17b2d45a7f61n,M62=(1n<<62n)-1n,chk2=v=>BigInt(fnv(v.toString(36)+'|casino-v2')&0x3ffff);
function saveCode(){
  let mask=0n;AVITEMS.forEach((it,i)=>{if(W.owned.includes(it))mask|=1n<<BigInt(i)});
  const bank=BigInt(Math.min(Math.floor(W.bank),2**27-1));
  const pay=((bank<<35n)|mask)^SALT2&M62,v=(pay<<18n)|chk2(pay);
  return toB32(v,16).match(/.{4}/g).join('-');
}
function readCode(code){
  try{
    const c=normCode(code);
    if(/^[0-9A-Z]{16}$/.test(c)){
      const v=fromB32(c);if(v==null)return null;
      const pay=v>>18n;if(chk2(pay)!==(v&0x3ffffn))return null;
      const raw=(pay^SALT2)&M62,bank=Number(raw>>35n),mask=raw&((1n<<35n)-1n);
      return {bank,owned:AVITEMS.filter((it,i)=>mask&(1n<<BigInt(i)))};
    }
    if(/^[0-9A-Z]{12}$/.test(c)){ /* ancien code (12 caractères) */
      const OLD=['joueur','croupier','cowboy','pirate','chat','renard','panda','robot','magicien','alien','fantome','roi','flambeur','astronaute'];
      const SALT=0x5a3c9e17b2d4n,M45=(1n<<45n)-1n,chk=v=>BigInt(fnv(v.toString(36)+'|casino-entre-amis')&0x7fff);
      const v=fromB32(c);if(v==null)return null;
      const pay=v>>15n;if(chk(pay)!==(v&0x7fffn))return null;
      const raw=(pay^SALT)&M45,bank=Number(raw>>18n),m=Number((raw>>4n)&0x3fffn),av=Number(raw&15n);
      const r=fromOld(OLD.filter((a,i)=>m&(1<<i)),OLD[av]);
      return {bank,owned:r.owned,cfg:r.cfg};
    }
    return null;
  }catch(e){return null}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let cardSeq=0;

/* ===== Réseau : un téléphone héberge la table, les autres s'y connectent (PeerJS, gratuit) ===== */
const PRE='casinofr26-',LET='ABCDEFGHJKLMNPQRSTUVWXYZ',GAMES={B:'blackjack.html',P:'poker.html',R:'roulette.html',G:'minigolf.html',M:'menteur.html',J:'justeprix.html',C:'crash.html',L:'menteurcartes.html'};
const Net={isHost:false,me:null,code:'',peer:null,hostConn:null,conns:new Map(),cfg:null,live:false,avs:{}};
Net.view=id=>{const s=Net.cfg.view(id);s.me=id;s.avs=Net.avs;return s};
Net.push=()=>{
  if(!Net.isHost)return;
  for(const [id,c] of Net.conns)if(c.open){try{c.send({t:'state',s:Net.view(id)})}catch(e){}}
  Net.show(Net.view('host'));
};
Net.show=s=>{
  if(!Net.live){Net.live=true;$('lobby').classList.add('hide');$('game').classList.remove('hide');$('hdr').classList.remove('hide');$('codeTxt').textContent=Net.code}
  if(typeof s.myBank==='number'&&isFinite(s.myBank)&&s.myBank>=0){W.bank=s.myBank;saveW()}
  Net.cfg.render(s);
};
Net.send=(a,v)=>{if(Net.isHost)Net.cfg.onAct('host',a,v);else if(Net.hostConn&&Net.hostConn.open)Net.hostConn.send({t:'act',a,v})};
function lerr(t,busy){$('lerr').textContent=t;$('create').disabled=$('join').disabled=!!busy}
function lobbyName(){const n=$('pname').value.trim().slice(0,12);if(!n){lerr('Écris ton prénom d\'abord');return null}W.name=n;saveW();return n}
function netOK(){if(typeof Peer==='undefined'){lerr('Module réseau introuvable : vérifie ta connexion internet puis recharge la page');return false}return true}
Net.create=(tries=0)=>{
  const name=lobbyName();if(!name||!netOK())return;
  lerr('Création de la table…',true);
  Net.code=Net.cfg.letter+Array.from({length:3},()=>LET[Math.floor(Math.random()*LET.length)]).join('');
  const peer=Net.peer=new Peer(PRE+Net.code);
  peer.on('open',()=>{Net.isHost=true;Net.me='host';Net.avs.host=W.cfg;Net.cfg.onCreate(name,W.bank);Net.push()});
  peer.on('connection',c=>{
    c.on('data',d=>{
      if(!d||typeof d!=='object')return;
      if(d.t==='join'){
        const nm=String(d.name||'').trim().slice(0,12)||'Joueur',bk=Number(d.bank);
        const err=Net.cfg.onJoin(c.peer,nm,Number.isFinite(bk)&&bk>=0&&bk<1e9?bk:1000);
        if(err){c.send({t:'refuse',msg:err});setTimeout(()=>c.close(),400);return}
        Net.avs[c.peer]=cfgStr(parseCfg(d.av));Net.conns.set(c.peer,c);Net.push();
      }else if(d.t==='act'&&Net.conns.has(c.peer))Net.cfg.onAct(c.peer,d.a,d.v);
    });
    c.on('close',()=>{if(Net.conns.delete(c.peer))Net.cfg.onLeave(c.peer)});
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<3){peer.destroy();Net.create(tries+1);return}
    if(!Net.live)lerr('Impossible de créer la table. Vérifie ta connexion internet.');
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
};
Net.join=raw=>{
  const name=lobbyName();if(!name)return;
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){lerr('Le code fait 4 lettres');return}
  if(code[0]!==Net.cfg.letter){if(GAMES[code[0]]){location.href=GAMES[code[0]]+'?code='+code;return}lerr('Code inconnu');return}
  if(!netOK())return;
  lerr('Connexion à la table…',true);Net.code=code;
  const peer=Net.peer=new Peer();
  const to=setTimeout(()=>{if(!Net.live){lerr('Pas de réponse. Vérifie le code et que le créateur a la page ouverte.');peer.destroy()}},15000);
  peer.on('open',id=>{
    Net.me=id;
    const c=Net.hostConn=peer.connect(PRE+code,{reliable:true});
    c.on('open',()=>c.send({t:'join',name,bank:W.bank,av:W.cfg}));
    c.on('data',d=>{if(!d)return;if(d.t==='state'){clearTimeout(to);Net.show(d.s)}else if(d.t==='refuse'){clearTimeout(to);lerr(String(d.msg||'Table refusée'))}});
    c.on('close',()=>{if(Net.live){$('lostTxt').textContent='Le créateur a quitté la partie.';$('lost').classList.remove('hide')}});
  });
  peer.on('error',e=>{clearTimeout(to);if(!Net.live)lerr(e.type==='peer-unavailable'?'Aucune table avec ce code':'Connexion impossible. Vérifie ta connexion internet.')});
};
Net.init=cfg=>{
  Net.cfg=cfg;
  $('pname').value=W.name||'';
  $('myav').innerHTML=avatarHTML(W.cfg,'lg');
  $('create').onclick=()=>Net.create();
  $('join').onclick=()=>Net.join($('jcode').value);
  $('jcode').addEventListener('keydown',e=>{if(e.key==='Enter')Net.join($('jcode').value)});
  const leave=()=>{try{Net.peer&&Net.peer.destroy()}catch(e){}location.href='index.html'};
  $('quit').onclick=leave;$('lostBtn').onclick=leave;
  window.addEventListener('beforeunload',()=>{try{Net.peer&&Net.peer.destroy()}catch(e){}});
  const q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase();
  if(code){$('jcode').value=code;if(W.name)Net.join(code)}
  else if(q.get('create')&&W.name)Net.create();
};

  l:{n:'Citron',w:25,p:8,svg:'<svg viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="24" ry="18" fill="#ffd24a" transform="rotate(-20 32 34)"/><path d="M9 44 L4 48 M55 24 L60 20" stroke="#e0a800" stroke-width="5" stroke-linecap="round"/><ellipse cx="24" cy="28" rx="7" ry="4" fill="#fff3b0" transform="rotate(-20 24 28)"/></svg>'},
  b:{n:'Cloche',w:18,p:15,svg:'<svg viewBox="0 0 64 64"><path d="M32 8 Q48 10 48 30 L50 44 Q56 46 56 50 L8 50 Q8 46 14 44 L16 30 Q16 10 32 8Z" fill="#f0b429" stroke="#a87a10" stroke-width="2"/><circle cx="32" cy="55" r="5" fill="#a87a10"/><path d="M24 18 Q22 28 22 38" stroke="#fff3b0" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="32" cy="7" r="3" fill="#a87a10"/></svg>'},
  r:{n:'BAR',w:12,p:30,svg:'<svg viewBox="0 0 64 64"><rect x="4" y="18" width="56" height="28" rx="6" fill="#1b1b1b" stroke="#ffd24a" stroke-width="3"/><text x="32" y="40" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="19" fill="#ffd24a">BAR</text></svg>'},
  s:{n:'Étoile',w:8,p:75,svg:'<svg viewBox="0 0 64 64"><path d="M32 4 L40 23 L60 24 L44 37 L50 58 L32 46 L14 58 L20 37 L4 24 L24 23Z" fill="#1f8fdc" stroke="#0a4a80" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 14 L36 26 L46 27" stroke="#9fd3ff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'},
  7:{n:'Sept',w:5,p:150,svg:'<svg viewBox="0 0 64 64"><path d="M12 10 H54 V18 Q36 36 32 58 H18 Q22 36 38 20 H12Z" fill="#c8102e" stroke="#ffd24a" stroke-width="3" stroke-linejoin="round"/></svg>'}
};
const KEYS=Object.keys(SYM),TOTW=KEYS.reduce((t,k)=>t+SYM[k].w,0);
const rnd=()=>{let r=Math.random()*TOTW;for(const k of KEYS){r-=SYM[k].w;if(r<0)return k}return 'c'};
const ico=k=>(SYM[k]||SYM.c).svg;
function evalSpin(r,bet,jackpot){
  const [a,b,c]=r;
  if(a===b&&b===c){
    if(a==='7'){const j=Math.floor(jackpot*Math.min(1,bet/100));return {win:bet*150+j,label:'JACKPOT 7-7-7 !',jack:j}}
    return {win:bet*SYM[a].p,label:`Trois ${SYM[a].n==='BAR'?'BAR':SYM[a].n.toLowerCase()+'s'}`};
  }
  const n7=r.filter(x=>x==='7').length,nc=r.filter(x=>x==='c').length;
  if(n7===2)return {win:bet*5,label:'Deux 7'};
  if(nc===2)return {win:bet*2,label:'Deux cerises'};
  return {win:0,label:''};
}

/* ---------- Jeu en solo ---------- */
let bet=10,spinning=false,shown=[['c','l','b'],['b','c','l'],['l','b','c']];
const ST={jackpot:JSEED,spins:0,best:0,feed:[]};
try{Object.assign(ST,JSON.parse(localStorage.getItem('casino-slots')||'{}'))}catch(e){}
const saveST=()=>{try{localStorage.setItem('casino-slots',JSON.stringify(ST))}catch(e){}};
$('cab').querySelector('.lights').innerHTML='<i></i>'.repeat(10);
$('myav').innerHTML=avatarHTML(W.cfg);
$('pay').innerHTML=[...KEYS].reverse().map(k=>`<tr><td><span class="ic">${ico(k)+ico(k)+ico(k)}</span> ${SYM[k].n}</td><td>${k==='7'?'×150 + jackpot':'×'+SYM[k].p}</td></tr>`).join('')+
  `<tr><td><span class="ic">${ico('7')+ico('7')}</span> deux 7</td><td>×5</td></tr><tr><td><span class="ic">${ico('c')+ico('c')}</span> deux cerises</td><td>×2</td></tr>`;
function setReel(i,syms,anim,dur){
  const el=$('r'+i),S=el.parentElement.clientHeight/3||80;
  if(!anim){el.style.transition='none';el.style.transform='translateY(0)';el.innerHTML=syms.map(k=>`<div class="sym">${ico(k)}</div>`).join('');return}
  const strip=[...shown[i],...Array.from({length:18+i*6},rnd),...syms];
  el.style.transition='none';el.style.transform='translateY(0)';el.innerHTML=strip.map(k=>`<div class="sym">${ico(k)}</div>`).join('');
  el.offsetHeight;
  el.style.transition=reduceMotion?'none':`transform ${dur}ms cubic-bezier(.2,.75,.25,1.04)`;
  el.style.transform=`translateY(${-(strip.length-3)*S}px)`;
}
for(let i=0;i<3;i++)setReel(i,shown[i],false);
function render(){
  $('bankTop').textContent=fmt(W.bank);
  $('jack').textContent=fmt(Math.floor(ST.jackpot));
  $('refill').classList.toggle('hide',W.bank>=5||spinning);
  $('bets').innerHTML=BETS.map(v=>`<button data-b="${v}" aria-pressed="${v===bet}" ${W.bank<v&&v!==bet?'disabled':''}>${v}</button>`).join('');
  $('spin').disabled=spinning||W.bank<bet;$('spin').textContent=`Lancer (${bet})`;
  $('stats').innerHTML=ST.spins?`${ST.spins} lancer${ST.spins>1?'s':''} · meilleur gain <b>${fmt(ST.best)}</b>`:'';
  $('feed').innerHTML=ST.feed.map(f=>`<li class="${f.big?'big':''}"><span>${esc(f.label)} <b>+${fmt(f.win)}</b></span></li>`).join('');
}
function spin(){
  if(spinning||W.bank<bet)return;
  const b=bet;spinning=true;
  W.bank-=b;ST.jackpot+=b*.02;
  const reels=[rnd(),rnd(),rnd()],r=evalSpin(reels,b,ST.jackpot);
  if(r.jack)ST.jackpot=Math.max(JSEED,ST.jackpot-r.jack);
  W.bank+=r.win;ST.spins++;if(r.win>ST.best)ST.best=r.win;
  if(r.win){ST.feed.unshift({label:r.label,win:r.win,big:!!r.jack||r.win>=b*75});ST.feed=ST.feed.slice(0,6)}
  saveW();saveST();
  const shownBank=W.bank-r.win;
  $('cab').classList.remove('win');$('res').textContent='';$('res').className='res';
  render();$('bankTop').textContent=fmt(shownBank);
  reels.forEach((k,i)=>{const col=[rnd(),k,rnd()];setReel(i,col,true,1100+i*450);shown[i]=col});
  setTimeout(()=>{
    for(let i=0;i<3;i++)setReel(i,shown[i],false);
    spinning=false;
    if(r.win){$('cab').classList.add('win');$('res').textContent=`${r.label} : +${fmt(r.win)} !`}else{$('res').textContent='Pas de chance…';$('res').className='res lose'}
    render();
  },reduceMotion?150:2120);
}
$('bets').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||spinning)return;bet=+b.dataset.b;render()});
$('spin').onclick=spin;
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();spin()}});
addEventListener('resize',()=>{if(!spinning)for(let i=0;i<3;i++)setReel(i,shown[i],false)});
render();
}
</script>
</body>
