<style>
:root{color-scheme:dark;--felt:#0d5a37;--felt2:#063520;--ink:#f6efdc;--dim:#bcd3c3;--red:#c8102e;--gold:#ffe28a;--card:#fffdf7;--cw:clamp(58px,16vw,86px)}
*{box-sizing:border-box;min-width:0}
html{background:var(--felt2)}

body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;
background:radial-gradient(ellipse 120% 80% at 50% 35%,#1a8452 0%,var(--felt) 45%,var(--felt2) 100%) fixed}
.wrap{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(4vw,12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(4vw,12px,env(safe-area-inset-left));display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.home{color:var(--dim);text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:0 10px;min-height:38px;display:inline-flex;align-items:center;white-space:nowrap}
h1{font:400 clamp(26px,6.5vw,38px)/1.05 Limelight,serif;margin:0;letter-spacing:.02em}
.code{background:rgba(0,0,0,.3);border:1px dashed rgba(255,226,138,.6);border-radius:12px;padding:4px 12px;font-size:14px;color:var(--dim);white-space:nowrap}
.code b{font-size:22px;letter-spacing:.15em;color:var(--gold);margin-left:6px}
.table{display:flex;flex-direction:column;gap:12px;margin:14px 0;padding:16px 8px;border:2px solid rgba(246,239,220,.25);border-radius:28px 28px 40px 40px}
.zone{text-align:center}
.zone h2{font-size:14px;font-weight:600;color:var(--dim);margin:0 0 6px}
.score{display:inline-block;margin-left:4px;background:rgba(0,0,0,.35);border-radius:999px;padding:0 9px;color:var(--ink);font-variant-numeric:tabular-nums}
.cards{display:flex;justify-content:center;min-height:calc(var(--cw)*1.4)}
.card{width:var(--cw);aspect-ratio:5/7;background:var(--card);color:#1b1b1b;border-radius:calc(var(--cw)*.11);position:relative;flex:none;
box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 5px 12px rgba(0,0,0,.35);font-family:"Playfair Display",serif}
.card+.card{margin-left:calc(var(--cw)*-.45)}

.card .tl{top:6%;left:8%}.card .br{bottom:6%;right:8%;transform:rotate(180deg)}
.card i{display:block;font-style:normal;font-size:.8em}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5)}
.card.back::after{content:"";position:absolute;inset:calc(var(--cw)*.07);border-radius:5px;background:repeating-linear-gradient(45deg,#a50e27 0 6px,#c8102e 6px 12px)}

@keyframes in{from{transform:translate(40px,-120px) rotate(-12deg);opacity:0}}

.msg.win{color:var(--gold)}.msg.lose{color:#ffb3b3}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.seat.me{background:rgba(0,0,0,.34)}

.seat.out{opacity:.5}
.av{display:inline-block;width:46px;height:46px;border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 3px 8px rgba(0,0,0,.35)}.av svg{width:100%;height:100%;display:block}
.av.sm{width:34px;height:34px}.av.lg{width:96px;height:96px}
.seat>.av{display:block;margin:0 auto 4px}
.seat.on>.av{box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,0,0,.35)}
.merow{display:flex;align-items:center;gap:12px}.merow a{color:var(--gold);font-size:14px}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:400;color:var(--gold)}
.bk{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.r{display:block;font-weight:700}.win{color:var(--gold)}.lose{color:#ffb3b3}.push{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chip{width:52px;height:52px;border-radius:50%;border:4px dashed rgba(255,255,255,.85);font:700 15px Outfit,sans-serif;color:#fff;cursor:pointer;box-shadow:0 0 0 3px var(--c),0 5px 10px rgba(0,0,0,.4);background:var(--c);flex:none}
.chip:active{transform:translateY(2px)}.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.sel{box-shadow:0 0 0 3px var(--c),0 0 0 6px var(--gold),0 5px 10px rgba(0,0,0,.4)}
a.b{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button.b,a.b{min-height:48px;padding:0 16px;border-radius:12px;border:0;font:600 16px Outfit,sans-serif;cursor:pointer;background:var(--ink);color:#0a3a24;flex:1 1 120px;max-width:240px}
button.b.p,a.b.p{background:var(--red);color:#fff}
button.b.s{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(255,255,255,.25);flex:none;min-height:40px}
button.b:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wait{color:var(--dim);text-align:center}
.hide{display:none!important}
.panel{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:20px;margin:18px 0;display:grid;gap:12px}
.panel h2{margin:0;font-size:22px}
.lbl{font-size:14px;color:var(--dim);margin-bottom:-6px}
.panel input,.field{min-height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--ink);font:18px Outfit,sans-serif;padding:0 14px;width:100%;-webkit-user-select:text;user-select:text}
#jcode,.codein{text-transform:uppercase;letter-spacing:.3em;font-weight:700;text-align:center}
.panel button.b{max-width:none}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.err{color:#ffb3b3;margin:0;min-height:24px;font-weight:600}
.note{margin:0;color:var(--dim);font-size:14px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--dim)}
.foot b{color:var(--ink)}
.lost{position:fixed;inset:auto 12px calc(16px + env(safe-area-inset-bottom)) 12px;z-index:20;background:#2a0d12;border:1px solid #ffb3b3;border-radius:16px;padding:14px;display:grid;gap:10px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lost p{margin:0;font-weight:700}
.lost button.b{max-width:none}
@media(max-width:600px){.table{padding:12px 4px}.chip{width:46px;height:46px;font-size:14px}.seats{gap:8px}}
@media(prefers-reduced-motion:reduce){.deal{animation:none}}

.q{text-align:center;display:grid;gap:6px;justify-items:center}
.q .mode{font-size:14px;color:var(--dim)}
.q h2{margin:0;font:400 clamp(22px,6vw,30px)/1.2 Limelight,serif;max-width:24em}
.q .unit{color:var(--gold);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold)}
.guess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:440px;margin:0 auto;width:100%}
.guess input{min-height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--ink);font:700 26px Outfit,sans-serif;text-align:center;padding:0 12px;-webkit-user-select:text;user-select:text;width:100%}
.guess button.b{min-width:120px}
.tries{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px}
.tries li{border-radius:10px;padding:4px 10px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25)}
.tries .up{color:#9dff6a}.tries .down{color:#ffb3b3}.tries .ok{background:var(--gold);color:#3a2a00}
.range{text-align:center;color:var(--dim);font-size:14px}
.range b{color:var(--ink)}
.res{display:grid;gap:4px;max-width:460px;margin:0 auto;width:100%}
.res li{display:flex;justify-content:space-between;gap:10px;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.res li.w{background:rgba(255,226,138,.18);color:var(--gold);font-weight:700}
.res{list-style:none;padding:0;margin:0 auto}
.answer{font:400 clamp(30px,9vw,46px)/1 Limelight,serif;color:var(--gold);text-align:center}
.st{font-size:13px;color:var(--dim)}
.lobbyg{display:grid;gap:10px;text-align:center}
.stakes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stakes button{min-height:44px;min-width:64px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--ink);font:700 16px Outfit,sans-serif;cursor:pointer;padding:0 12px}
.stakes button[aria-pressed=true]{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.potv{font:400 22px/1.1 Limelight,serif;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><a class="home" href="index.html">← Accueil</a><h1>Juste Prix</h1></div>
  <div class="bar hide" id="hdr"><span class="code">Code<b id="codeTxt"></b></span><button class="b s" id="quit">Quitter</button></div>
</header>
<section class="panel" id="lobby">
  <div class="merow"><span id="myav"></span><a href="boutique.html">Changer d'avatar dans la boutique</a></div>
  <label class="lbl" for="pname">Ton prénom</label>
  <input id="pname" maxlength="12" placeholder="Prénom" autocomplete="off">
  <button class="b p" id="create">Créer une table</button>
  <div class="or">ou</div>
  <input id="jcode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" aria-label="Code de la table">
  <button class="b" id="join">Rejoindre la table</button>
  <p class="err" id="lerr" role="alert"></p>
  <p class="note">Deux modes : Plus ou moins (trouve le nombre secret le plus vite) et Estimation (la réponse la plus proche gagne). Jusqu'à 8 joueurs. Le créateur donne le code à 4 lettres à ses amis et garde la page ouverte pendant la partie.</p>
</section>
<div id="lost" class="lost hide"><p id="lostTxt"></p><button class="b p" id="lostBtn">Retour à l'accueil</button></div>
<div id="game" class="hide" style="display:contents">
<main class="table">
  <section class="q" id="q"></section>
  <div class="msg" id="msg" role="status"></div>
  <section id="play" class="hide" style="display:grid;gap:10px">
    <div class="range" id="range"></div>
    <form class="guess" id="gform"><input id="gin" type="number" inputmode="numeric" autocomplete="off" aria-label="Ta réponse"><button class="b p" id="gbtn">Valider</button></form>
    <ul class="tries" id="tries"></ul>
  </section>
  <section id="result" class="hide" style="display:grid;gap:10px"></section>
  <section id="lob" class="lobbyg hide"></section>
  <section class="seats" id="seats"></section>
</main>
<div class="foot"><span id="rulesf"></span><span id="potf"></span></div>
</div>
</div>
<script>
/* ===== Outils communs du casino ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toLocaleString('fr-FR',{maximumFractionDigits:1});
const reduceMotion=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduceMotion?60:ms));

/* Porte-monnaie partagé entre tous les jeux */
const W={name:'',bank:1000,owned:[],cfg:'',bonusDay:'',lastRefill:0};
try{Object.assign(W,JSON.parse(localStorage.getItem('casino-wallet')||'{}'))}catch(e){}
if(!(typeof W.bank==='number'&&W.bank>=0&&W.bank<1e9))W.bank=1000;
if(!Array.isArray(W.owned))W.owned=[];

/* ===== Avatars personnalisables : un personnage + des accessoires ===== */
const AVO={
  b:[['human','Humain',0],['cat','Chat',1000],['fox','Renard',1500],['panda','Panda',2000],['robot','Robot',3000],['alien','Extraterrestre',5000],['ghost','Fantôme',7500]],
  sk:[['#f1c9a5','Clair',0],['#e0a982','Doré',0],['#c68a5e','Mat',0],['#8d5a3b','Brun',0],['#5c3a24','Foncé',0]],
  bg:[['#1f5fbf','Bleu',0],['#0a8a4a','Vert',0],['#c77a2c','Orange',0],['#2b4c7e','Marine',0],['#6a2c91','Violet',0],['#7a0f22','Bordeaux',0],['#26313d','Ardoise',0],['#8a6a12','Bronze',0],['rainbow','Arc-en-ciel',3000],['galaxy','Galaxie',6000]],
  h:[['none','Chauve',0],['court','Court',0],['meche','Mèche',200],['long','Longs',400],['chignon','Chignon',400],['afro','Afro',600],['crete','Crête',800]],
  hc:[['#5a3a22','Châtain',0],['#1b1b1b','Noir',0],['#d9a441','Blond',0],['#a0522d','Roux',0],['#e8e8e8','Blanc',0],['#c8102e','Rouge',0]],
  e:[['normal','Normaux',0],['joyeux','Joyeux',200],['rondes','Lunettes rondes',400],['patch','Cache-œil',800],['shades','Lunettes de soleil',1500],['monocle','Monocle',2500]],
  m:[['sourire','Sourire',0],['grand','Grand sourire',150],['langue','Langue',300],['moustache','Moustache',700],['barbe','Barbe',1200]],
  hat:[['none','Aucun',0],['casquette','Casquette',300],['bonnet','Bonnet',400],['fete','Chapeau de fête',500],['cowboy','Cowboy',600],['bandana','Bandana',800],['audio','Casque audio',900],['haut','Haut-de-forme',2500],['wizard','Chapeau de magicien',4000],['crown','Couronne',10000],['helmet','Casque spatial',50000]],
  n:[['none','Aucun',0],['bowtie','Nœud papillon',300],['echarpe','Écharpe',500],['chain','Chaîne en or',8000]]
};
const AVCAT={b:'Personnage',sk:'Peau',bg:'Fond',h:'Coiffure',hc:'Cheveux',e:'Yeux',m:'Bouche',hat:'Chapeau',n:'Cou'};
const AVKEYS=Object.keys(AVO);
const AVITEMS=[];AVKEYS.forEach(k=>AVO[k].forEach((o,i)=>{if(o[2]>0)AVITEMS.push(k+':'+i)}));
const itemPrice=(k,i)=>AVO[k][i]?AVO[k][i][2]:0;
const owns=(k,i,owned=W.owned)=>itemPrice(k,i)===0||owned.includes(k+':'+i);
const DEFCFG={b:0,sk:0,bg:0,h:1,hc:0,e:0,m:0,hat:0,n:0};
function parseCfg(str){
  const c={...DEFCFG};
  String(str||'').split('.').forEach((v,j)=>{const k=AVKEYS[j],n=parseInt(v,10);if(k&&Number.isInteger(n)&&n>=0&&n<AVO[k].length)c[k]=n});
  return c;
}
const cfgStr=c=>AVKEYS.map(k=>c[k]).join('.');
function cleanCfg(c,owned=W.owned){const o={...c};AVKEYS.forEach(k=>{if(!owns(k,o[k],owned))o[k]=DEFCFG[k]});return o}

/* Ancienne boutique (avatars tout faits) -> nouveaux accessoires */
const OLDMAP={croupier:[['n',1],['hc',1]],cowboy:[['hat',4]],pirate:[['hat',5],['e',3]],chat:[['b',1]],renard:[['b',2]],panda:[['b',3]],robot:[['b',4]],
  magicien:[['hat',8],['m',4]],alien:[['b',5]],fantome:[['b',6]],roi:[['hat',9],['m',4]],flambeur:[['e',4],['n',3]],astronaute:[['hat',10]]};
function fromOld(ids,eq){
  const owned=[],c={...DEFCFG};
  for(const id of ids)for(const [k,i] of OLDMAP[id]||[]){if(itemPrice(k,i)>0&&!owned.includes(k+':'+i))owned.push(k+':'+i)}
  for(const [k,i] of OLDMAP[eq]||[])c[k]=i;
  return {owned,cfg:cfgStr(c)};
}
if(W.owned.some(id=>OLDMAP[id]||id==='joueur')){const m=fromOld(W.owned,W.avatar);W.owned=m.owned;W.cfg=m.cfg}
W.owned=W.owned.filter(x=>AVITEMS.includes(x));
W.cfg=cfgStr(cleanCfg(parseCfg(W.cfg)));
function saveW(){try{localStorage.setItem('casino-wallet',JSON.stringify({name:W.name,bank:W.bank,owned:W.owned,cfg:W.cfg,bonusDay:W.bonusDay,lastRefill:W.lastRefill}))}catch(e){}}

function drawAvatar(c){
  const B=AVO.b[c.b][0],E='#222',acc=k=>AVO[k][c[k]][0],skin=AVO.sk[c.sk][0],bgv=AVO.bg[c.bg][0],hc=AVO.hc[c.hc][0];
  let s='';
  if(bgv==='rainbow')s+=`<defs><linearGradient id="avrb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".35" stop-color="#ffd24a"/><stop offset=".65" stop-color="#4ad07a"/><stop offset="1" stop-color="#4a7aff"/></linearGradient></defs><circle cx="32" cy="32" r="32" fill="url(#avrb)"/>`;
  else if(bgv==='galaxy')s+=`<defs><radialGradient id="avgx" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#6a3fc0"/><stop offset=".6" stop-color="#1b1146"/><stop offset="1" stop-color="#05040f"/></radialGradient></defs><circle cx="32" cy="32" r="32" fill="url(#avgx)"/>`+[[12,14],[50,10],[54,40],[8,44],[20,56],[44,58],[40,8]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.1" fill="#fff"/>`).join('');
  else s+=`<circle cx="32" cy="32" r="32" fill="${bgv}"/>`;
  s+=`<circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>`;
  const hair=acc('h'),eyes=acc('e'),mouth=acc('m'),hat=acc('hat'),neck=acc('n');
  let eyeY=36;
  if(B==='human'){
    if(hair==='afro')s+=`<circle cx="32" cy="29" r="22" fill="${hc}"/>`;
    if(hair==='long')s+=`<path d="M14 36 Q13 18 32 17 Q51 18 50 36 L52 56 Q44 52 40 48 L24 48 Q20 52 12 56Z" fill="${hc}"/>`;
    s+=`<rect x="25" y="50" width="14" height="10" fill="${skin}"/><path d="M12 64 Q14 52 32 52 Q50 52 52 64Z" fill="rgba(0,0,0,.35)"/><circle cx="32" cy="36" r="16" fill="${skin}"/>`;
    if(hair==='court'||hair==='long'||hair==='chignon'||hair==='meche')s+=`<path d="M16 34 Q16 18 32 18 Q48 18 48 34 Q44 26 32 25 Q22 25 16 34Z" fill="${hc}"/>`;
    if(hair==='meche')s+=`<path d="M18 30 Q24 16 44 22 Q36 22 30 30 Q26 26 18 30Z" fill="${hc}" stroke="rgba(0,0,0,.2)" stroke-width=".8"/>`;
    if(hair==='chignon')s+=`<circle cx="32" cy="15" r="6" fill="${hc}"/>`;
    if(hair==='afro')s+=`<path d="M17 32 Q20 22 32 22 Q44 22 47 32" fill="none" stroke="${hc}" stroke-width="3"/>`;
    if(hair==='crete')s+=`<path d="M27 22 L29 6 L32 18 L35 5 L37 22Z" fill="${hc}"/>`;
    s+=eyes==='joyeux'?`<path d="M23 37 Q26 33 29 37 M35 37 Q38 33 41 37" stroke="${E}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`:eyes==='shades'?'':`<circle cx="26" cy="36" r="2.4" fill="${E}"/><circle cx="38" cy="36" r="2.4" fill="${E}"/>`;
    if(mouth==='barbe')s+=`<path d="M17 38 Q19 57 32 58 Q45 57 47 38 Q41 47 32 47 Q23 47 17 38Z" fill="${hc==='#e8e8e8'?'#e9e9e9':hc}"/>`;
    if(mouth==='grand')s+=`<path d="M25 42 Q32 52 39 42Z" fill="#5a1a1a" stroke="${E}" stroke-width="1.6" stroke-linejoin="round"/><path d="M27 43h10" stroke="#fff" stroke-width="2"/>`;

/* ===== Code de sauvegarde : 16 caractères (jetons + accessoires achetés) ===== */
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h}
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const toB32=(v,n)=>{let t='';for(let i=n-1;i>=0;i--)t+=B32[Number((v>>BigInt(i*5))&31n)];return t};
function normCode(code){return String(code).toUpperCase().replace(/[\s-]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V')}
function fromB32(c){let v=0n;for(const ch of c){const k=B32.indexOf(ch);if(k<0)return null;v=(v<<5n)|BigInt(k)}return v}
const SALT2=0x3c9e17b2d45a7f61n,M62=(1n<<62n)-1n,chk2=v=>BigInt(fnv(v.toString(36)+'|casino-v2')&0x3ffff);
function saveCode(){
  let mask=0n;AVITEMS.forEach((it,i)=>{if(W.owned.includes(it))mask|=1n<<BigInt(i)});
  const bank=BigInt(Math.min(Math.floor(W.bank),2**27-1));
  const pay=((bank<<35n)|mask)^SALT2&M62,v=(pay<<18n)|chk2(pay);
  return toB32(v,16).match(/.{4}/g).join('-');
}
function readCode(code){
  try{
    const c=normCode(code);
    if(/^[0-9A-Z]{16}$/.test(c)){
      const v=fromB32(c);if(v==null)return null;
      const pay=v>>18n;if(chk2(pay)!==(v&0x3ffffn))return null;
      const raw=(pay^SALT2)&M62,bank=Number(raw>>35n),mask=raw&((1n<<35n)-1n);
      return {bank,owned:AVITEMS.filter((it,i)=>mask&(1n<<BigInt(i)))};
    }
    if(/^[0-9A-Z]{12}$/.test(c)){ /* ancien code (12 caractères) */
      const OLD=['joueur','croupier','cowboy','pirate','chat','renard','panda','robot','magicien','alien','fantome','roi','flambeur','astronaute'];
      const SALT=0x5a3c9e17b2d4n,M45=(1n<<45n)-1n,chk=v=>BigInt(fnv(v.toString(36)+'|casino-entre-amis')&0x7fff);
      const v=fromB32(c);if(v==null)return null;
      const pay=v>>15n;if(chk(pay)!==(v&0x7fffn))return null;
      const raw=(pay^SALT)&M45,bank=Number(raw>>18n),m=Number((raw>>4n)&0x3fffn),av=Number(raw&15n);
      const r=fromOld(OLD.filter((a,i)=>m&(1<<i)),OLD[av]);
      return {bank,owned:r.owned,cfg:r.cfg};
    }
    return null;
  }catch(e){return null}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== Réseau : un téléphone héberge la table, les autres s'y connectent (PeerJS, gratuit) ===== */
const PRE='casinofr26-',LET='ABCDEFGHJKLMNPQRSTUVWXYZ',GAMES={B:'blackjack.html',P:'poker.html',R:'roulette.html',G:'minigolf.html',M:'menteur.html',J:'justeprix.html',C:'crash.html',L:'menteurcartes.html'};
const Net={isHost:false,me:null,code:'',peer:null,hostConn:null,conns:new Map(),cfg:null,live:false,avs:{}};
Net.view=id=>{const s=Net.cfg.view(id);s.me=id;s.avs=Net.avs;return s};
Net.push=()=>{
  if(!Net.isHost)return;
  for(const [id,c] of Net.conns)if(c.open){try{c.send({t:'state',s:Net.view(id)})}catch(e){}}
  Net.show(Net.view('host'));
};
Net.show=s=>{
  if(!Net.live){Net.live=true;$('lobby').classList.add('hide');$('game').classList.remove('hide');$('hdr').classList.remove('hide');$('codeTxt').textContent=Net.code}
  if(typeof s.myBank==='number'&&isFinite(s.myBank)&&s.myBank>=0){W.bank=s.myBank;saveW()}
  Net.cfg.render(s);
};
Net.send=(a,v)=>{if(Net.isHost)Net.cfg.onAct('host',a,v);else if(Net.hostConn&&Net.hostConn.open)Net.hostConn.send({t:'act',a,v})};
function lerr(t,busy){$('lerr').textContent=t;$('create').disabled=$('join').disabled=!!busy}
function lobbyName(){const n=$('pname').value.trim().slice(0,12);if(!n){lerr('Écris ton prénom d\'abord');return null}W.name=n;saveW();return n}
function netOK(){if(typeof Peer==='undefined'){lerr('Module réseau introuvable : vérifie ta connexion internet puis recharge la page');return false}return true}
Net.create=(tries=0)=>{
  const name=lobbyName();if(!name||!netOK())return;
  lerr('Création de la table…',true);
  Net.code=Net.cfg.letter+Array.from({length:3},()=>LET[Math.floor(Math.random()*LET.length)]).join('');
  const peer=Net.peer=new Peer(PRE+Net.code);
  peer.on('open',()=>{Net.isHost=true;Net.me='host';Net.avs.host=W.cfg;Net.cfg.onCreate(name,W.bank);Net.push()});
  peer.on('connection',c=>{
    c.on('data',d=>{
      if(!d||typeof d!=='object')return;
      if(d.t==='join'){
        const nm=String(d.name||'').trim().slice(0,12)||'Joueur',bk=Number(d.bank);
        const err=Net.cfg.onJoin(c.peer,nm,Number.isFinite(bk)&&bk>=0&&bk<1e9?bk:1000);
        if(err){c.send({t:'refuse',msg:err});setTimeout(()=>c.close(),400);return}
        Net.avs[c.peer]=cfgStr(parseCfg(d.av));Net.conns.set(c.peer,c);Net.push();
      }else if(d.t==='act'&&Net.conns.has(c.peer))Net.cfg.onAct(c.peer,d.a,d.v);
    });
    c.on('close',()=>{if(Net.conns.delete(c.peer))Net.cfg.onLeave(c.peer)});
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<3){peer.destroy();Net.create(tries+1);return}
    if(!Net.live)lerr('Impossible de créer la table. Vérifie ta connexion internet.');
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
};
Net.join=raw=>{
  const name=lobbyName();if(!name)return;
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){lerr('Le code fait 4 lettres');return}
  if(code[0]!==Net.cfg.letter){if(GAMES[code[0]]){location.href=GAMES[code[0]]+'?code='+code;return}lerr('Code inconnu');return}
  if(!netOK())return;
  lerr('Connexion à la table…',true);Net.code=code;
  const peer=Net.peer=new Peer();
  const to=setTimeout(()=>{if(!Net.live){lerr('Pas de réponse. Vérifie le code et que le créateur a la page ouverte.');peer.destroy()}},15000);
  peer.on('open',id=>{
    Net.me=id;
    const c=Net.hostConn=peer.connect(PRE+code,{reliable:true});
    c.on('open',()=>c.send({t:'join',name,bank:W.bank,av:W.cfg}));
    c.on('data',d=>{if(!d)return;if(d.t==='state'){clearTimeout(to);Net.show(d.s)}else if(d.t==='refuse'){clearTimeout(to);lerr(String(d.msg||'Table refusée'))}});
    c.on('close',()=>{if(Net.live){$('lostTxt').textContent='Le créateur a quitté la partie.';$('lost').classList.remove('hide')}});
  });
  peer.on('error',e=>{clearTimeout(to);if(!Net.live)lerr(e.type==='peer-unavailable'?'Aucune table avec ce code':'Connexion impossible. Vérifie ta connexion internet.')});
};
Net.init=cfg=>{
  Net.cfg=cfg;
  $('pname').value=W.name||'';
  $('myav').innerHTML=avatarHTML(W.cfg,'lg');
  $('create').onclick=()=>Net.create();
  $('join').onclick=()=>Net.join($('jcode').value);
  $('jcode').addEventListener('keydown',e=>{if(e.key==='Enter')Net.join($('jcode').value)});
  const leave=()=>{try{Net.peer&&Net.peer.destroy()}catch(e){}location.href='index.html'};
  $('quit').onclick=leave;$('lostBtn').onclick=leave;
  window.addEventListener('beforeunload',()=>{try{Net.peer&&Net.peer.destroy()}catch(e){}});
  const q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase();
  if(code){$('jcode').value=code;if(W.name)Net.join(code)}
  else if(q.get('create')&&W.name)Net.create();
};

  const me=s.players.find(p=>p.id===s.me);
  $('msg').textContent=s.msg;$('msg').className='msg '+(s.mcls||'');
  $('potf').textContent=s.pot?`Pot : ${fmt(s.pot)} jetons`:'';
  $('rulesf').textContent=s.mode==='pm'?`Plus ou moins : nombre entre 1 et ${PM_MAX}, ${MAXT} essais maximum`:'Estimation : une seule réponse, la plus proche gagne';
  const live=s.phase==='play';
  $('q').innerHTML=live||s.phase==='result'?(s.mode==='pm'?`<span class="mode">Manche ${s.round} · Plus ou moins</span><h2>Trouve le nombre secret entre 1 et ${PM_MAX}</h2>`:`<span class="mode">Manche ${s.round} · Estimation</span><h2>${esc(s.question)}</h2>${s.unit?`<span class="unit">Réponse en ${esc(s.unit)}</span>`:''}`)+(live?`<span class="timer" id="timer"></span>`:''):'';
  clearInterval(tick);
  if(live){const end=Date.now()+s.left*1000,t=()=>{const e=$('timer');if(e)e.textContent=`${Math.max(0,Math.ceil((end-Date.now())/1000))} s`};t();tick=setInterval(t,500)}
  $('seats').innerHTML=s.players.map(p=>`<div class="seat${p.id===s.me?' me':''}${p.left?' out':''}">${avatarHTML(s.avs&&s.avs[p.id],'sm')}<div class="nm">${esc(p.name)}${p.id===s.me?' <small>(toi)</small>':''}</div>
    <div class="bk">${fmt(p.bank)} jetons</div><div class="st">${!p.playing?(s.phase==='play'?'Spectateur':''):p.found?'Trouvé ✓':p.done?(s.mode==='pm'?'Plus d\'essai':'A répondu ✓'):live?(s.mode==='pm'?`${p.tries} essai${p.tries>1?'s':''}…`:'Réfléchit…'):''}</div></div>`).join('');
  const canPlay=live&&me&&me.playing&&!me.done;
  $('play').classList.toggle('hide',!(live&&me&&me.playing));
  if(live&&me&&me.playing){
    const key=s.round+'';if(key!==lastQ){lastQ=key;$('gin').value=''}
    $('gin').disabled=$('gbtn').disabled=!canPlay;
    $('gbtn').textContent=s.mode==='pm'?'Essayer':'Valider';
    $('gin').placeholder=s.mode==='pm'?`1 à ${PM_MAX}`:'Ta réponse';
    if(s.mode==='pm'){
      let lo=1,hi=PM_MAX;(me.hist||[]).forEach(([g,r])=>{if(r==='up')lo=Math.max(lo,g+1);if(r==='down')hi=Math.min(hi,g-1)});
      $('range').innerHTML=me.found?'<b>Bravo, tu l\'as trouvé !</b>':me.done?'Plus d\'essai pour cette manche':`Entre <b>${lo}</b> et <b>${hi}</b> · ${MAXT-me.tries} essai${MAXT-me.tries>1?'s':''} restant${MAXT-me.tries>1?'s':''}`;
      $('tries').innerHTML=(me.hist||[]).map(([g,r])=>`<li class="${r}">${g} ${r==='up'?'↑ c\'est plus':r==='down'?'↓ c\'est moins':'✓'}</li>`).join('');
    }else{$('range').textContent=me.done?`Ta réponse : ${fmt(me.answer)} — en attente des autres…`:'Une seule réponse possible, sois précis !';$('tries').innerHTML=''}
  }
  const rs=$('result');
  if(s.phase==='result'&&s.res){
    rs.classList.remove('hide');
    rs.innerHTML=`<div class="answer">${s.mode==='pm'?'Le nombre était ':'Réponse : '}${fmt(s.res.answer)}${s.unit&&s.mode!=='pm'?` <small style="font-size:16px">${esc(s.unit)}</small>`:''}</div>
      <ol class="res">${s.res.rows.map(r=>`<li class="${r.gain?'w':''}"><span>${esc(r.name)}</span><span>${esc(r.txt)}${r.gain?` · +${fmt(r.gain)}`:''}</span></li>`).join('')}</ol>`;
  }else rs.classList.add('hide');
  const lob=$('lob');
  if(s.phase==='lobby'||s.phase==='result'){
    lob.classList.remove('hide');
    const host=s.me==='host',n=s.players.filter(p=>!p.left&&p.bank>=s.stake).length;
    let h=`<div class="potv">Mise par manche : ${s.stake?fmt(s.stake)+' jetons':'gratuit'}</div>`;
    if(host)h+=`<div class="stakes">${[['pm','Plus ou moins'],['est','Estimation']].map(([m,l])=>`<button data-mode="${m}" aria-pressed="${m===s.mode}">${l}</button>`).join('')}</div>
      <div class="stakes">${[0,25,50,100,250].map(v=>`<button data-stake="${v}" aria-pressed="${v===s.stake}">${v}</button>`).join('')}</div>
      <button class="b p" id="go" style="max-width:none" ${n?'':'disabled'}>${s.phase==='result'?'Manche suivante':'Lancer la manche'} (${n} joueur${n>1?'s':''})</button>`;
    else h+=`<p class="wait">Le créateur de la table choisit le mode et lance la manche.</p>`;
    lob.innerHTML=h;
  }else lob.classList.add('hide');
}
$('gform').addEventListener('submit',e=>{e.preventDefault();const v=Math.round(+$('gin').value);if(!Number.isFinite(v)||$('gin').value==='')return;Net.send('guess',v);$('gin').value='';$('gin').focus()});
$('lob').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.stake!=null)Net.send('stake',+b.dataset.stake);else if(b.dataset.mode)Net.send('mode',b.dataset.mode);else if(b.id==='go')Net.send('start')});

/* ---------- Hôte : logique du jeu ---------- */
let G=null,timer=null,qbag=[];
const newPlayer=(id,name,bank)=>({id,name,bank,playing:false,left:false,tries:0,hist:[],found:false,done:false,answer:null,t:0});
const say=(t,c='')=>{G.msg=t;G.mcls=c};
function view(id){
  const me=G.players.find(p=>p.id===id);
  return {phase:G.phase,mode:G.mode,round:G.round,stake:G.stake,pot:G.pot,msg:G.msg,mcls:G.mcls,question:G.q?G.q[0]:'',unit:G.q?G.q[2]:'',
    left:G.phase==='play'?Math.max(0,(G.end-Date.now())/1000):0,res:G.res,
    players:G.players.map(p=>({id:p.id,name:p.name,bank:p.bank,playing:p.playing,left:p.left,tries:p.tries,found:p.found,done:p.done,
      hist:p.id===id?p.hist:undefined,answer:p.id===id||G.phase==='result'?p.answer:null})),
    myBank:me?me.bank:undefined};
}
function act(pid,a,v){
  if(!G)return;
  const p=G.players.find(q=>q.id===pid);if(!p||p.left)return;
  const idle=G.phase==='lobby'||G.phase==='result';
  if(a==='stake'){if(pid==='host'&&idle&&[0,25,50,100,250].includes(+v)){G.stake=+v;Net.push()}return}
  if(a==='mode'){if(pid==='host'&&idle&&(v==='pm'||v==='est')){G.mode=v;Net.push()}return}
  if(a==='start'){
    if(pid!=='host'||!idle)return;
    G.players=G.players.filter(q=>!q.left);
    const ps=G.players.filter(q=>q.bank>=G.stake);if(!ps.length)return;
    G.players.forEach(q=>{Object.assign(q,{playing:ps.includes(q),tries:0,hist:[],found:false,done:false,answer:null,t:0});if(q.playing)q.bank-=G.stake});
    G.pot=G.stake*ps.length;G.round++;G.res=null;
    if(G.mode==='pm'){G.secret=1+Math.floor(Math.random()*PM_MAX);G.q=null;G.end=Date.now()+PM_TIME*1000;say('C\'est parti ! Trouve le nombre secret')}
    else{if(!qbag.length)qbag=shuffle(QUESTIONS.map((_,i)=>i));G.q=QUESTIONS[qbag.pop()];G.secret=G.q[1];G.end=Date.now()+EST_TIME*1000;say('À vos estimations !')}
    G.phase='play';Net.push();clearTimeout(timer);timer=setTimeout(endRound,(G.mode==='pm'?PM_TIME:EST_TIME)*1000);return;
  }
  if(a==='guess'){
    if(G.phase!=='play'||!p.playing||p.done)return;
    const g=Math.round(+v);if(!Number.isFinite(g)||g<0||g>1e9)return;
    if(G.mode==='pm'){
      if(g<1||g>PM_MAX)return;
      p.tries++;const r=g===G.secret?'ok':g<G.secret?'up':'down';p.hist.push([g,r]);p.answer=g;
      if(r==='ok'){p.found=true;p.done=true;p.t=Date.now();say(`${p.name} a trouvé en ${p.tries} essai${p.tries>1?'s':''} !`,'win')}
      else if(p.tries>=MAXT)p.done=true;
    }else{p.answer=g;p.done=true;p.t=Date.now()}
    Net.push();
    if(G.players.every(q=>!q.playing||q.done||q.left))endRound();
  }
}
function endRound(){
  if(G.phase!=='play')return;
  clearTimeout(timer);
  const ps=G.players.filter(q=>q.playing&&!q.left),S=G.secret;
  let winners=[],rows;
  if(G.mode==='pm'){
    const found=ps.filter(q=>q.found).sort((a,b)=>a.tries-b.tries||a.t-b.t);
    if(found.length){const b=found[0];winners=found.filter(q=>q.tries===b.tries&&q.t===b.t)}
    else{const withA=ps.filter(q=>q.answer!=null);if(withA.length){const d=Math.min(...withA.map(q=>Math.abs(q.answer-S)));winners=withA.filter(q=>Math.abs(q.answer-S)===d)}}
    rows=[...ps].sort((a,b)=>(b.found-a.found)||(a.found?a.tries-b.tries||a.t-b.t:Math.abs((a.answer??1e9)-S)-Math.abs((b.answer??1e9)-S))).map(q=>({id:q.id,name:q.name,txt:q.found?`trouvé en ${q.tries} essai${q.tries>1?'s':''}`:q.answer!=null?`pas trouvé (dernier : ${q.answer})`:'pas joué'}));
  }else{
    const withA=ps.filter(q=>q.answer!=null);
    if(withA.length){const d=Math.min(...withA.map(q=>Math.abs(q.answer-S)));winners=withA.filter(q=>Math.abs(q.answer-S)===d)}
    rows=[...ps].sort((a,b)=>Math.abs((a.answer??1e12)-S)-Math.abs((b.answer??1e12)-S)).map(q=>({id:q.id,name:q.name,txt:q.answer!=null?`${fmt(q.answer)} (écart ${fmt(Math.abs(q.answer-S))})`:'pas de réponse'}));
  }
  const share=winners.length?Math.floor(G.pot/winners.length):0;
  winners.forEach(q=>q.bank+=share);
  if(!winners.length)ps.forEach(q=>q.bank+=G.stake);
  rows.forEach(r=>{r.gain=winners.some(q=>q.id===r.id)?share:0});
  G.res={answer:S,rows};G.pot=0;G.phase='result';
  say(winners.length?`${winners.map(q=>q.name).join(' et ')} remporte${winners.length>1?'nt':''} ${fmt(share)} jetons !`:'Personne n\'a répondu, mises rendues',winners.length?'win':'');
  Net.push();
}
function leave(pid){
  const i=G.players.findIndex(p=>p.id===pid),p=G.players[i];if(!p)return;
  say(`${p.name} a quitté la table`);
  if(G.phase!=='play'){G.players.splice(i,1);Net.push();return}
  p.left=true;Net.push();
  if(G.players.every(q=>!q.playing||q.done||q.left))endRound();
}

Net.init({letter:'J',view,render,onAct:act,onLeave:leave,
  onCreate(name,bank){G={phase:'lobby',mode:'pm',round:0,stake:25,pot:0,msg:'',mcls:'',q:null,secret:0,end:0,res:null,players:[newPlayer('host',name,bank)]};say(`Table créée ! Donne le code ${Net.code} à tes amis`)},
  onJoin(id,name,bank){
    if(G.players.filter(p=>!p.left).length>=MAXP)return 'La table est pleine (8 joueurs)';
    G.players=G.players.filter(p=>p.id!==id);G.players.push(newPlayer(id,name,bank));say(`${name} a rejoint la table`);return null;
  }});
}
</script>
